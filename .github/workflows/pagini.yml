name: Actualizează paginile

on:
  schedule:
    - cron: '17 4 * * 1'   # în fiecare luni, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Topuri IMDb și Letterboxd
        working-directory: filme-seriale
        run: python3 -I actualizeaza.py bobec --web
      - name: Adună site-ul
        run: |
          mkdir -p site/filme
          cp filme-seriale/index.html site/filme/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
