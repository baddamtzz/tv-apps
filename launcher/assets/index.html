 var g=$('pg');if(c.offsetTop+c.offsetHeight>g.scrollTop+g.clientHeight)g.scrollTop=c.offsetTop+c.offsetHeight-g.clientHeight+20;if(c.offsetTop<g.scrollTop)g.scrollTop=Math.max(0,c.offsetTop-20)}
function closePanel(){S.mode='nav';$('panel').style.display='none'}
var PS5_ID='com.tcl.tvinput/.TvPassThroughService/HDMI100008';
function openPs5(){
 var arr=[];try{arr=JSON.parse(TV.inputs())}catch(e){}
 var x=arr.filter(function(i){return i.pass&&/\/HDMI1\d*$/.test(i.id)})[0];
 var id=x?x.id:(TV.get('ps5_id')||PS5_ID);
 if(x)TV.set('ps5_id',id);else toast('PS5 nu răspunde pe CEC, încerc HDMI 1…',2400);
 TV.openInput(id)}
function openSources(){
 var arr=[];try{arr=JSON.parse(TV.inputs())}catch(e){}
 var items=[{id:'tvmenu',l:'TV (meniul stock)',i:'ti-device-tv',go:function(){TV.openTv()}}];
 arr.forEach(function(x){if(x.error)return;if(x.pass)items.push({id:x.id,l:x.label,i:'ti-plug-connected',go:function(){TV.openInput(x.id)}})});
 openPanel('Surse','Intrările TV-ului tău. Meniul stock rămâne pe butonul Input al telecomenzii.',items,true)}
function openOptions(){
 openPanel('Opțiuni','Setări ale ecranului Acasă',[
  {id:'up',l:'Actualizează interfața acum',i:'ti-refresh',go:function(){try{TV.refreshUi();toast('Caut o versiune nouă…',2200)}catch(e){toast('Nu merge pe această versiune')}}}
 ],true)}
function openAll(){
 var items=ALL.map(function(a){var id='p:'+a.p,shown=ORDER.indexOf(id)>=0;return {id:id,l:a.l,pkg:a.p,tag:shown?'':'ascunsă',go:function(){launchApp(a.p)},pin:id}});
 openPanel('Toate aplicațiile','OK deschide · ține apăsat OK ca să o afișezi sau să o ascunzi de pe ecranul principal',items,false)}
function panelHold(){
 var it=PG.items[PG.idx];if(!it||!it.pin)return;var id=it.pin,ix=ORDER.indexOf(id);
 if(ix>=0){ORDER.splice(ix,1);HIDDEN.push(id);toast(it.l+' ascunsă')}
 else{HIDDEN=HIDDEN.filter(function(x){return x!==id});ORDER.push(id);toast(it.l+' adăugată pe ecranul principal')}
 save();var c=$('pg').querySelectorAll('.c')[PG.idx],tg=c.querySelector('.tag');
 if(ORDER.indexOf(id)>=0){if(tg)c.removeChild(tg)}else if(!tg){tg=document.createElement('div');tg.className='tag';tg.textContent='ascunsă';c.appendChild(tg)}
 buildA();loadIconsRefill();relayout()}
function panelOk(){var it=PG.items[PG.idx];if(it){closePanel();setTimeout(function(){it.go()},120)}}
var press={on:false,t:0,fired:false,tm:0};
function holdFire(){if(!press.on||press.fired)return;press.fired=true;if(S.mode==='nav')startEdit();else if(S.mode==='panel'&&!PG.list)panelHold()}
function isOk(e){return e.key==='Enter'||e.keyCode===13||e.keyCode===23}
document.addEventListener('keydown',function(e){
 var k=e.key,h=true,kc=e.keyCode;
 if(S.mode==='nav'){
  if(kc===183||k==='ColorF0Red'){e.preventDefault();SPEC.fotbal.go();return}
  if(kc===184||k==='ColorF1Green'){e.preventDefault();SPEC.filme.go();return}
  if(kc===185||k==='ColorF2Yellow'){e.preventDefault();openSources();return}
  if((kc===82||k==='ContextMenu')&&S.row==='A'){e.preventDefault();startEdit();return}}
 if(isOk(e)){
  if(press.on&&Date.now()-press.t>4000)press={on:false,t:0,fired:false,tm:0};
  if(!e.repeat&&!press.on){press={on:true,t:Date.now(),fired:false};clearTimeout(press.tm);press.tm=setTimeout(holdFire,650)}
  e.preventDefault();return}
 if(S.mode==='panel'){
  var cols=PG.list?1:Math.max(1,Math.floor(($('pg').clientWidth+3*U*1)/(26*U+3*U)));
  if(k==='ArrowRight')pfocus(PG.idx+1);else if(k==='ArrowLeft')pfocus(PG.idx-1);else if(k==='ArrowDown')pfocus(PG.idx+cols);else if(k==='ArrowUp')pfocus(PG.idx-cols);else h=false;
  if(h)e.preventDefault();return}
 if(S.mode==='edit'){
  if(k==='ArrowRight')editMove(1);else if(k==='ArrowLeft')editMove(-1);else if(k==='ArrowDown')editHide();else h=false;
  if(h)e.preventDefault();return}
 if(k==='ArrowRight')move(1);else if(k==='ArrowLeft')move(-1);
 else if(k==='ArrowDown'&&S.row==='A'){S.row='B';relayout()}
 else if(k==='ArrowUp'&&S.row==='B'){S.row='A';relayout()}
 else if(k==='ArrowUp'&&S.row==='A'&&R_ITEMS.length){S.row='R';relayout()}
 else if(k==='ArrowDown'&&S.row==='R'){S.row='A';relayout()}
 else h=false;
 if(h)e.preventDefault()});
document.addEventListener('keyup',function(e){
 if(!isOk(e))return;var p=press;clearTimeout(p.tm);press={on:false,t:0,fired:false,tm:0};if(!p.on||p.fired)return;
 if(S.mode==='nav')activate();else if(S.mode==='edit')endEdit(false);else if(S.mode==='panel')panelOk();
 e.preventDefault()});
window.onBack=function(){
 if(S.mode==='edit'){endEdit(true);return true}
 if(S.mode==='panel'){closePanel();return true}
 if(S.row!=='A'){S.row='A';relayout();return true}
 if(S.ia!==0){S.ia=0;relayout();return true}
 return true};
window.onShown=function(){tick();buildR();relayout();weatherSoon()};
window.onHome=function(){if(S.mode==='edit')endEdit(true);if(S.mode==='panel')closePanel();S.row='A';S.ia=0;buildR();relayout();tick()};
function start(){
 load();buildA();buildB();buildR();tick();weather();setInterval(weatherSoon,5*60000);try{TV.ready()}catch(e){}setInterval(tick,20000);
 document.body.classList.add('ent');relayout();loadIcons();
 setTimeout(function(){document.body.classList.remove('ent')},1500);
 addEventListener('resize',function(){U=document.documentElement.clientWidth/192;TILES.A.forEach(function(t){t.style.width=28*U+'px';t.style.height=15.75*U+'px'});TILES.B.concat(TILES.R).forEach(function(t){t.style.width=22*U+'px';t.style.height=8.6*U+'px'});relayout()})}
start();
</script>
